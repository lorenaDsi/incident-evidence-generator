plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

repositories {
    mavenCentral()
    mavenLocal()
}

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

application {
    mainClass = 'com.empresa.reporte.IncidentEvidenceGeneratorApp'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    // Java 21 Core
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    
    // Database - SQL Server JDBC
    implementation 'com.microsoft.sqlserver:mssql-jdbc:12.6.1.jre11'
    
    // Connection Pooling
    implementation 'com.zaxxer:HikariCP:5.1.0'
    
    // Apache POI - Excel Generation
    implementation 'org.apache.poi:poi:5.2.3'
    implementation 'org.apache.poi:poi-ooxml:5.2.3'
    
    // ZIP Compression
    implementation 'org.apache.commons:commons-compress:1.26.1'
    
    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.11'
    implementation 'ch.qos.logback:logback-classic:1.5.3'
    implementation 'ch.qos.logback:logback-core:1.5.3'
    
    // Configuration Management
    implementation 'org.yaml:snakeyaml:2.2'
    
    // Utilities
    implementation 'commons-io:commons-io:2.15.1'
    implementation 'commons-lang:commons-lang:2.6'
    
    // JSON Processing (Optional for future enhancements)
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // Testing - JUnit 5
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.0'
    
    // Mocking and Testing
    testImplementation 'org.mockito:mockito-core:5.6.1'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.6.1'
    
    // Assertions
    testImplementation 'org.assertj:assertj-core:3.24.1'
}

tasks.named('test') {
    useJUnitPlatform()
    
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams false
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '--enable-preview'
}

compileTestJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '--enable-preview'
}

test {
    jvmArgs += '--enable-preview'
}

shadowJar {
    archiveFileName = 'incident-evidence-generator-all.jar'
    manifest {
        attributes(
            'Main-Class': 'com.empresa.reporte.IncidentEvidenceGeneratorApp',
            'Implementation-Title': 'Incident Evidence Generator',
            'Implementation-Version': project.version,
            'Created-By': 'Gradle',
            'Build-Timestamp': new Date().format('yyyy-MM-dd HH:mm:ss')
        )
    }
}

jar {
    archiveFileName = 'incident-evidence-generator.jar'
    manifest {
        attributes(
            'Main-Class': 'com.empresa.reporte.IncidentEvidenceGeneratorApp',
            'Implementation-Title': 'Incident Evidence Generator',
            'Implementation-Version': project.version
        )
    }
}

group = 'com.empresa'
version = '1.0.0'